apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bakery
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: crumb-and-ember
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/singhgauravlinux-coder/bakery-multistage-live/api-gateway:2e71aee
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
            # Swagger UI runs on its own port so it can be exposed (or not)
            # by a separate Service + Ingress instead of riding on /api.
            - name: docs
              containerPort: 3100
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_NAME
              value: "api-gateway"
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            # API docs are NOT served on the public /api listener. They are
            # published by the `api-docs` Service via its own Ingress host.
            - name: API_DOCS_ON_GATEWAY
              value: "false"
            - name: DOCS_SERVER_ENABLED
              value: "true"
            - name: DOCS_PORT
              value: "3100"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bakery
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
# Separate Service for the docs listener. Splitting this out is what lets the
# docs Ingress target the documentation without ever being able to route to
# the API proxy, and lets you delete/disable the docs entirely by removing
# this Service + its Ingress.
apiVersion: v1
kind: Service
metadata:
  name: api-docs
  namespace: bakery
  labels:
    app: api-gateway
    component: docs
spec:
  selector:
    app: api-gateway
  ports:
    - name: docs
      port: 3100
      targetPort: 3100
      protocol: TCP

