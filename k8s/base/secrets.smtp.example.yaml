# SMTP credentials for notification-worker.
#
# Deliberately NOT in kustomization.yaml — this file is a template, and the
# real values are applied out of band so they never sit in git or in a
# rendered overlay:
#
#   cp k8s/base/secrets.smtp.example.yaml k8s/secrets-smtp.yaml   (git-ignored)
#   $EDITOR k8s/secrets-smtp.yaml
#   kubectl -n bakery-dev apply -f k8s/secrets-smtp.yaml
#
# Or straight from literals, without a file on disk at all:
#
#   kubectl -n bakery-dev create secret generic smtp-credentials \
#     --from-literal=host=smtp.gmail.com \
#     --from-literal=port=587 \
#     --from-literal=username='you@gmail.com' \
#     --from-literal=password='<16-char app password, spaces removed>' \
#     --from-literal=from='Crumb & Ember <you@gmail.com>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The namespace differs per environment (bakery-dev / bakery-uat /
# bakery-prod), so pass -n explicitly rather than relying on the metadata
# below, and apply it once per environment you want mail from.
#
# Every key is consumed with `optional: true`, so the worker starts fine
# before this secret exists — it just logs `smtp_disabled` and mocks email
# instead of sending it. Create the secret and restart the worker:
#
#   kubectl -n bakery-dev rollout restart deploy/notification-worker
#
# GMAIL NOTES
#   - Requires 2-Step Verification, then an App Password from
#     https://myaccount.google.com/apppasswords — a normal account password
#     is rejected (Google retired "less secure app" access).
#   - Strip the spaces Google displays in the 16-character password.
#   - Gmail rewrites the From header to the authenticated account, so `from`
#     is cosmetic there.
#   - Quotas are low (~2,000/day) and parallel sessions are throttled: keep
#     SMTP_MAX_CONNECTIONS at 1 and WORKER_CONCURRENCY low when pointed at
#     Gmail. It is a smoke-test target, not a load-test target.
apiVersion: v1
kind: Secret
metadata:
  name: smtp-credentials
  namespace: bakery
type: Opaque
stringData:
  host: smtp.gmail.com
  port: "587"
  # "true" only for implicit-TLS port 465; 587 upgrades via STARTTLS.
  secure: "false"
  username: CHANGE_ME@gmail.com
  password: CHANGE_ME_16_CHAR_APP_PASSWORD
  from: Crumb & Ember <CHANGE_ME@gmail.com>

